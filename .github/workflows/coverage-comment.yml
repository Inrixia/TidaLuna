name: "Coverage comment"

# Posts the coverage table the Test workflow produced as a comment on the pull request.
#
# It runs on workflow_run, in this repo, with a write token: a `pull_request` run from a fork only gets a read-only one,
# which is why the comment can't be posted there. The safety property is that nothing here checks out or runs the pull
# request's code — it downloads a text artifact and posts it, so a hostile PR gets no code execution with this token.

on:
 workflow_run:
  workflows: ["Test"]
  types: [completed]

concurrency:
 group: coverage-comment-${{ github.event.workflow_run.id }}

permissions:
 actions: read
 pull-requests: write

jobs:
 Comment:
  runs-on: ubuntu-latest
  # Pushes to master/dev have no pull request to comment on, the badges cover those
  if: github.event.workflow_run.event == 'pull_request'
  steps:
   - name: Find the pull request
     id: pr
     uses: actions/github-script@v7
     with:
      script: |
       const run = context.payload.workflow_run;
       let number = run.pull_requests?.[0]?.number;
       if (number === undefined && run.head_branch !== null) {
        // A run from a fork's branch does not carry its pull request in the payload, and its commit does not exist in
        // this repo (a fork's SHA is only here once merged), so ask for the pull request by the branch it ran on. The
        // head filter needs `<owner>:<branch>`, and for a branch of this repo the owner is this repo's.
        const owner = run.head_repository?.owner?.login ?? context.repo.owner;
        const { data } = await github.rest.pulls.list({
         owner: context.repo.owner,
         repo: context.repo.repo,
         head: `${owner}:${run.head_branch}`,
         state: "open",
        });
        number = data[0]?.number;
       }
       if (number === undefined) {
        // A warning, not info: this job exists to post a comment, and doing nothing quietly is the failure mode it had
        core.warning("No open pull request for this run, nothing to comment on");
        return;
       }
       core.setOutput("number", number);

   - name: Download the coverage comment
     if: steps.pr.outputs.number != ''
     continue-on-error: true
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: gh run download ${{ github.event.workflow_run.id }} -R ${{ github.repository }} -n coverage-comment -D coverage-artifact

   - name: Post it
     if: steps.pr.outputs.number != ''
     uses: actions/github-script@v7
     with:
      script: |
       const fs = require("fs");
       const marker = "<!-- luna-coverage -->";
       let body;
       try {
        body = fs.readFileSync("coverage-artifact/comment.md", "utf8");
       } catch {
        core.warning("The Test run did not upload a coverage comment, nothing to post");
        return;
       }
       // The body is built from paths in the pull request, so treat it as text, not as something to trust
       if (!body.includes(marker)) {
        core.warning("The artifact is not a coverage comment, skipping");
        return;
       }
       body = body.slice(0, 60000);

       const { owner, repo } = context.repo;
       const issue_number = Number("${{ steps.pr.outputs.number }}");
       const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
       const existing = comments.find((comment) => comment.body?.includes(marker));
       if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
       else await github.rest.issues.createComment({ owner, repo, issue_number, body });
       core.info(`${existing ? "Updated" : "Created"} the coverage comment on #${issue_number}`);
