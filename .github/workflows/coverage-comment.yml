name: "Coverage comment"

# Posts the coverage table the Test workflow produced as a comment on the pull request.
#
# It runs on workflow_run, in this repo, with a write token: a `pull_request` run from a fork only gets a read-only one,
# which is why the comment can't be posted there. The safety property is that nothing here checks out or runs the pull
# request's code — it downloads a text artifact and posts it, so a hostile PR gets no code execution with this token.

on:
 workflow_run:
  workflows: ["Test"]
  types: [completed]

concurrency:
 group: coverage-comment-${{ github.event.workflow_run.id }}

permissions:
 actions: read
 pull-requests: write

jobs:
 Comment:
  runs-on: ubuntu-latest
  # Pushes to master/dev have no pull request to comment on, the badges cover those
  if: github.event.workflow_run.event == 'pull_request'
  steps:
   - uses: Inrixia/helpers.ts/.github/actions/coverage/comment@master
