name: "Test"

on:
 push:
  branches: [master, dev]
 pull_request:
 workflow_dispatch:

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
 Test:
  runs-on: ubuntu-latest
  timeout-minutes: 25
  permissions:
   # To find the base branch's run and download its coverage summary
   actions: read
   # To commit the badges and the raised floors on a push
   contents: write
  steps:
   - uses: actions/checkout@v7

   - name: Install pnpm 📥
     uses: pnpm/action-setup@v6
     with:
      # A major, not `latest`: a pnpm release should not be able to change how CI resolves dependencies unannounced
      version: 10

   - name: Install Node.js 📥
     uses: actions/setup-node@v7
     with:
      cache: pnpm
      node-version: lts/*

   - name: Install dependencies 📥
     # Fails when the lockfile and package.json disagree, instead of silently resolving a tree CI never tested
     run: pnpm install --frozen-lockfile

   - name: Test
     run: pnpm run coverage:ci

   - name: Coverage
     if: always()
     uses: Inrixia/helpers.ts/.github/actions/coverage@master
     with:
      areas: plugins
