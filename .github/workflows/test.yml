name: "Test"

on:
 push:
  branches: [master, dev]
 pull_request:
 workflow_dispatch:

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
 Test:
  runs-on: ubuntu-latest
  permissions:
   contents: write
   pull-requests: write
  steps:
   - uses: actions/checkout@v7

   - name: Install pnpm 📥
     uses: pnpm/action-setup@v6
     with:
      version: latest

   - name: Install Node.js 📥
     uses: actions/setup-node@v7
     with:
      cache: pnpm
      node-version: lts/*

   - name: Install dependencies 📥
     run: pnpm install

   - name: Test
     run: pnpm run coverage:ci

   # What the comment diffs against: the percentages committed on the base branch. Fetched rather than read from the
   # checkout, because a pull request's own copy is whatever its branch last committed, which is not the target. Absent
   # on the first run after this lands, and the comment then reports the numbers without a change.
   - name: Fetch the coverage baseline
     if: github.event_name == 'pull_request'
     continue-on-error: true
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      mkdir -p coverage
      gh api "repos/${{ github.repository }}/contents/.github/badges/coverage-baseline.json?ref=${{ github.base_ref }}" \
       --jq .content | tr -d '\n' | base64 -d > coverage/baseline.json

   # Always, so a failing run still reports the coverage it managed. Writes coverage/comment.md and the run page summary.
   - name: Coverage comment
     if: always()
     env:
      COVERAGE_BASELINE_LABEL: ${{ github.base_ref }}
     run: pnpm run coverage:comment
     continue-on-error: true

   # Posted by .github/workflows/coverage-comment.yml: a PR from a fork gets a read-only token here, so the comment has
   # to come from a workflow_run, which runs in this repo with a write token and never touches the PR's code.
   - name: Upload the coverage comment
     if: always()
     uses: actions/upload-artifact@v7
     with:
      name: coverage-comment
      path: coverage/comment.md
      if-no-files-found: ignore
      retention-days: 7

   # Another workflow (nix-hashes) also commits to master, so a run can check out a head that moves before it finishes
   # and then have nothing to fast-forward onto. Rebase before generating the files so they are built on the latest
   # head, and treat a lost race as cosmetic below rather than failing the build over it.
   - name: Sync with the branch head
     if: github.event_name == 'push'
     continue-on-error: true
     run: git pull --rebase --autostash origin ${{ github.ref_name }}

   # Badges are for the default branch only: a PR run has nothing to publish, and its badges would describe an
   # unmerged branch. The coverage thresholds above still gate every PR.
   - name: Coverage badges
     if: github.event_name == 'push'
     run: pnpm run coverage:badge

   # Floors only go up, so raising them where the merge lands keeps them honest without asking every PR to touch the file
   - name: Raise the coverage floors
     if: github.event_name == 'push'
     run: pnpm run coverage:thresholds

   # The badges are read over jsDelivr by shields.io, so they have to live in the repo. jsDelivr rather than
   # raw.githubusercontent.com: shields fetches the JSON on every render and raw rate-limits it, which shows up as a
   # broken badge. It caches for up to 12h, so a badge can trail the file by that much.
   # Commits made with GITHUB_TOKEN don't start another workflow run, so this can't loop.
   - name: Commit coverage badges
     if: github.event_name == 'push'
     continue-on-error: true
     uses: stefanzweifel/git-auto-commit-action@v7
     with:
      commit_message: "ci: update coverage badges"
      file_pattern: .github/badges/*.json

   - name: Commit the raised floors
     if: github.event_name == 'push'
     continue-on-error: true
     uses: stefanzweifel/git-auto-commit-action@v7
     with:
      commit_message: "ci: raise the coverage floors"
      file_pattern: test/coverageThresholds.ts
