name: "Build & Release"

on:
 push:
  branches: [master, dev]
 pull_request:
 workflow_dispatch:

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
 # A push can only publish when package.json's version changed, so decide that once, before anything expensive runs.
 # Deliberately cheap: one checkout, no install, no build.
 Version:
  if: github.event_name == 'push'
  runs-on: ubuntu-latest
  permissions:
   contents: read
  outputs:
   changed: ${{ steps.read.outputs.changed }}
   version: ${{ steps.read.outputs.version }}
  steps:
   - uses: actions/checkout@v7

   - id: read
     run: |
      # Compare against the commit the push started from, not HEAD^: a push can carry several commits, and the version
      # bump is not necessarily the tip, so HEAD^ would miss it and publish nothing.
      before="${{ github.event.before }}"
      previous=""
      if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
        git fetch --quiet --depth=1 origin "$before" || true
        previous=$(git show "$before:package.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
      fi
      version=$(jq -r .version package.json)
      echo "version=$version" >> "$GITHUB_OUTPUT"
      # An unknown previous version counts as changed: publishing stays guarded by the existing-release check, and
      # missing a release is worse than attempting one that turns out to exist.
      if [ -n "$previous" ] && [ "$version" = "$previous" ]; then
        echo "changed=false" >> "$GITHUB_OUTPUT"
        echo "$version is unchanged from $before, nothing to publish"
      else
        echo "changed=true" >> "$GITHUB_OUTPUT"
        echo "Version changed: ${previous:-unknown} -> $version"
      fi

 Build:
  needs: [Version]
  # Pull requests always build: the tests and the artifact are the point of running there. Pushes only when the version moved.
  if: always() && (github.event_name != 'push' || needs.Version.outputs.changed == 'true')
  runs-on: ubuntu-latest
  permissions:
   contents: read
  steps:
   - uses: actions/checkout@v7

   - name: Install pnpm 📥
     uses: pnpm/action-setup@v6
     with:
      version: latest

   - name: Install Node.js 📥
     uses: actions/setup-node@v7
     with:
      cache: pnpm
      node-version: lts/*

   - name: Install dependencies 📥
     run: pnpm install

   # Nothing downstream runs unless the tests pass: this step failing stops the build, the zip and the release
   - name: Test
     run: pnpm test

   - name: Build
     run: pnpm run build

   - name: Zip Build Output
     run: cd dist && zip -r ../luna.zip *

   - name: Upload Build Artifact
     uses: actions/upload-artifact@v7
     with:
      name: luna-artifacts
      path: |
       ./luna.zip
       ./package.json

 Release:
  # Publishes once per version: only reached when the version changed, and an existing release is never overwritten.
  needs: [Version, Build]
  if: needs.Version.outputs.changed == 'true'
  runs-on: ubuntu-latest
  permissions:
   contents: write
  steps:
   - uses: actions/download-artifact@v8
     with:
      name: luna-artifacts

   - name: Publish release on GitHub
     env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
     run: |
      VERSION=$(jq -r .version package.json)
      if gh release view "$VERSION" >/dev/null 2>&1; then
        echo "$VERSION is already released, skipping"
        exit 0
      fi
      PRERELEASE=$([ "$GITHUB_REF_NAME" = dev ] && echo --prerelease || true)
      gh release create "$VERSION" luna.zip --target "$GITHUB_SHA" --title "Release $VERSION" --generate-notes $PRERELEASE
