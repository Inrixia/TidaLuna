name: "Nix hashes"

# pnpmDeps hashes depend on the lockfile and differ per platform, so recompute them whenever it (or the nix setup) changes.

on:
 push:
  branches: [master, dev]
  paths:
   - "pnpm-lock.yaml"
   - "pnpm-workspace.yaml"
   - "flake.lock"
   - "nix/**"
   - ".github/workflows/nix-hashes.yml"
 workflow_dispatch:

concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 # Two pushes that touch the lockfile in quick succession would otherwise both run, and the second either fails to commit
 # or commits a hash computed against a head that has already moved.
 cancel-in-progress: true

permissions:
 contents: write

jobs:
 Linux:
  name: Update Linux pnpmDeps hash
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v7

   - uses: cachix/install-nix-action@v32
     with:
      extra_nix_config: |
       access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

   - name: Update injection-linux hash
     run: |
      NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
      nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#nix-update" --command nix-update --flake injection-linux --version=skip

   - uses: stefanzweifel/git-auto-commit-action@v7
     with:
      commit_message: "nix: update Linux pnpmDeps hash"

 Darwin:
  name: Update Darwin pnpmDeps hash
  needs: Linux
  runs-on: macos-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v7

   - name: Pull Linux hash commit
     # --autostash for the same reason test.yml uses it: another workflow also commits to this branch, so the head can
     # move under a run. A real conflict still fails here, which is right: hashes should not be committed on a stale tree.
     run: git pull --rebase --autostash

   - uses: cachix/install-nix-action@v32
     with:
      extra_nix_config: |
       access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

   - name: Update injection-darwin hash
     run: |
      NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
      nix shell "github:NixOS/nixpkgs/${NIXPKGS_REV}#nix-update" --command nix-update --flake injection-darwin --version=skip

   - uses: stefanzweifel/git-auto-commit-action@v7
     with:
      commit_message: "nix: update Darwin pnpmDeps hash"
